[package]
name = "still"
version = "0.2.3"
edition = "2024"
description = "A quiet, local-first native notes app"
license = "MIT"

[features]
ui-testing = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.1"
rusqlite = { version = "0.38", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
global-hotkey = "0.8"
tray-icon = { version = "0.26", default-features = false }
winreg = "0.55"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Notifications", "Win32_Security", "Win32_System_WinRT", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
