[package]
name = "still"
version = "0.1.0"
edition = "2024"
description = "A quiet, local-first native notes app"
license = "MIT"

[features]
ui-testing = ["gpui-kit/test-support"]

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
async-channel = "2"

[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
